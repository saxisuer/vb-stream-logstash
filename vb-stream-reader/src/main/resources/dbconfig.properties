# vb-stream-reader 连接配置（默认面向 src/docker 的本地 PG——cd src/docker && docker compose up -d）
#
# 键即 Debezium 配置键（不带 vb. 前缀）；启动时按三层合并：
#   本文件（基础值）→ 系统属性 -Dvb.<键>=<值>（覆盖同名项）→ reader 默认值（兜底）
# 临时覆盖单个参数用 -D（如 -Dvb.slot.name=another_slot），改动较多时复制本文件为外部
# 文件并用 -Dvb.config=<绝对路径> 整体替换（免重编译）。连接器其余配置项（slot.streaming/
# pipe.dir/slot.messages 等）按需追加，语义见 vb-stream-connector-postgres-stream/README.md 配置表。

# ---- 数据库连接（必填五项）----
database.hostname=localhost
database.port=55432
database.dbname=postgres
database.user=postgres
database.password=postgres

# ---- 复制面 ----
topic.prefix=vbread
slot.name=vb_reader
publication.name=vb_pub

# ---- 可选项（按需解开注释；默认值见 ReaderProperties javadoc）----
# slot.streaming=on
# slot.two.phase=true
# pipe.dir=pipe-queue-reader
# slot.feedback.interval.ms=1000
# slot.messages=false
# offset.storage.file.filename=data/reader-offsets.dat
# offset.flush.interval.ms=1000
