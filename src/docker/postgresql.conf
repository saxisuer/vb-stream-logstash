# ===============================================================
# vb-stream-logstash 专用 PostgreSQL 配置（逻辑解码 stream 模式测试）
# 挂载位置：容器内 /etc/postgresql/vb-postgresql.conf
# 修改后：cd src/docker && docker compose restart postgres
#
# 注意：本文件不在 PGDATA 内，PostgreSQL 对相对路径一律相对
# config_file 所在目录解析，因此下面三个路径必须显式指回数据目录。
# PG 18+ 镜像的 PGDATA 是版本化路径 /var/lib/postgresql/<大版本>/docker，
# 升级镜像大版本时需同步修改。
# ===============================================================
data_directory = '/var/lib/postgresql/18/docker'
hba_file       = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file     = '/var/lib/postgresql/18/docker/pg_ident.conf'

# ---- 逻辑解码（stream 模式）核心配置 ----
wal_level              = logical   # 逻辑解码必需（默认 replica）
max_wal_senders        = 16        # WAL 发送进程上限，每条复制连接占用一个
max_replication_slots  = 16        # 复制槽上限（含逻辑复制槽）
max_slot_wal_keep_size = 2GB       # 复制槽最多保留 2GB WAL，防止客户端失联时磁盘膨胀；0 = 不限制
max_prepared_transactions = 16     # 两阶段提交（two_phase 槽 + PREPARE TRANSACTION）必需，默认 0
logical_decoding_work_mem = 64kB   # 压低流式触发阈值，方便用较小数据量验证 stream 模式（默认 64MB）

# ---- 调试逻辑解码时可临时打开（输出量很大，平时保持注释）----
# log_min_messages         = debug2
# log_replication_commands = on

# ---- 连接 ----
listen_addresses = '*'
port             = 5432
max_connections  = 100

# ---- 内存（本地测试用默认值即可）----
shared_buffers = 128MB
