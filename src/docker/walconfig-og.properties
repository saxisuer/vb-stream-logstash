# vb-stream-wal-source 冒烟配置——openGauss 5.0.0 档模板
# 用法：复制到工作目录后零 -D 即可运行（-Dvb.wal.* 同键仍可临时覆盖）：
#   cp src/docker/walconfig-og.properties ./walconfig.properties
# 键名与 -D 参数完全同形（模块 README 配置键全表）；不想放工作目录时可用
# -Dvb.config=<本文件绝对路径> 整份指定。白名单外键 WARN 忽略。
# 前提：docker run -d --name og-m1 -e GS_PASSWORD=openGauss@123 -p 15700:5432 opengauss/opengauss:5.0.0
# （就绪约 60s；pg_hba replication 行镜像默认已含——自建部署须自查，见 README 快速开始）

# OG 容器映射端口与账号；库名显式指向 PG 兼容档库——M2 起 DML 面（Main 默认注入）
# 仅支持 DBCOMPATIBILITY 'PG' 库，镜像缺省 postgres 库是 'A' 档（Oracle 风格）会被
# 启动期护栏 ISE（A 档支持属 M3/B 档属 M4）。先建库再用：
#   docker exec og-m1 su - opengauss -c '/usr/local/opengauss/bin/gsql -d postgres -p 5432 \
#        -c "CREATE DATABASE vbpg DBCOMPATIBILITY '\''PG'\''"'
# （仅要 catalog 同步面时改回 postgres 库 + 加 vb.wal.dml=false 也可——catalog 面与兼容模式无关）
vb.wal.port=15700
vb.wal.db=vbpg
vb.wal.user=gaussdb
vb.wal.pass=openGauss@123

# SQL 会话驱动选 opengauss-jdbc（sha256 认证，OG 部署推荐；缺省 jdbc:postgresql: 走
# vanilla pgjdbc 须服务端 md5 化）
vb.wal.og.jdbc.prefix=jdbc:opengauss:

# 收流通道 direct = 纯 Java 裸 v3 协议直连（Windows/macOS 宿主机无 pg_receivexlog 时必选；
# 缺省 file = sidecar pg_receivexlog 落目录 tail，Linux 且装有该工具时可切）
vb.wal.og.source=direct

# 渲染面（默认 pg 档 = 与服务端文本输出逐字节同形；非 pg 档是有意分叉）
#vb.wal.render.float.style=plain      # pg(默认)|plain——1e+20 → 100000000000000000000
#vb.wal.render.date.format=default    # pg(默认)|default(=yyyy-MM-dd HH:mm:ss)|自定义 pattern
#vb.wal.render.time.format=default    # pg(默认)|default(=HH:mm:ss)|自定义 pattern
#vb.wal.render.truncate=64            # 值截断阈值（0 = 不截断全量输出）

# 检查点目录（启用续传/周期落盘/槽推进；去掉本行 = 每次全新引导）
vb.wal.state.dir=target/wal-og-state
