# vb-stream-wal-source 冒烟配置——PG 17/18 档模板（src/docker 本地 PG）
# 用法：复制到工作目录后零 -D 即可运行（-Dvb.wal.* 同键仍可临时覆盖）：
#   cp src/docker/walconfig-pg.properties ./walconfig.properties
# 键名与 -D 参数完全同形（模块 README 配置键全表）；不想放工作目录时可用
# -Dvb.config=<本文件绝对路径> 整份指定。白名单外键 WARN 忽略。
# 前提：cd src/docker && docker compose up -d（localhost:55432，wal_level=logical）

# 本地 compose PG 连接面（库名默认 postgres 不写）
vb.wal.port=55432
vb.wal.user=postgres
vb.wal.pass=postgres

# DML 输出面（默认 true；false 回纯 v1 catalog 形态）与表白名单（空 = 全放行）
#vb.wal.dml=true
#vb.wal.tables=public.t1,public.t2

# 检查点目录（启用续传/周期落盘/槽推进；去掉本行 = 每次全新引导）
vb.wal.state.dir=target/wal-source-state
